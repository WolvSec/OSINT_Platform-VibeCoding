# RSS / Atom example: parser.format rss normalises every item to
# {title, link, description, published, guid, categories, author, lat, lon}.
# lat/lon come from GeoRSS or geo:lat/geo:long and are null when the item has no location,
# so observation.optional: true drops unlocated items quietly instead of warning.
# Source: NOAA Pacific Tsunami Warning Center Atom feed (https://www.tsunami.gov/), no key.
# The feed usually holds only the latest bulletin, so expect 0 or 1 marker.
schema_version: 1
name: ptwc_tsunami_bulletins
source_type: noaa_tsunami
layer_type: tsunami_bulletins
display_name: 'PTWC Tsunami Bulletins'
enabled: true

layer:
  id: tsunami_bulletins
  name: Tsunami bulletins
  group: Hazards
  description: NOAA Pacific Tsunami Warning Center, latest bulletin

display:
  icon: tsunami
  color: '#00b4d8'
  size: 1.3
  ttl: '7d'
  fields:
    - { path: metadata.center, label: Issued by }
    - { path: timestamp, label: Issued, format: datetime }
    - { path: metadata.url, label: Bulletin, format: link }

transport:
  type: http_poll
  url: 'https://www.tsunami.gov/events/xml/PHEBAtom.xml'
  timeout: '20s'
  interval: '5m'
  retry:
    max_attempts: 3
    backoff: exponential
    initial_delay: '2s'
    max_delay: '30s'

parser:
  format: rss
  max_records: 50

entity:
  external_id: 'guid'
  name: '=trim(title)'
  metadata:
    center: "='Pacific Tsunami Warning Center'" # a constant string is an expression literal
    url: 'link'

observation:
  latitude: 'lat'
  longitude: 'lon'
  timestamp: 'published'
  optional: true

recording:
  mode: upsert
