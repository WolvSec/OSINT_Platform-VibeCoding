# CSV example: a CSV file with a header row; every value arrives as a string.
# Shows: parser.format csv, a filter expression, number() conversions, color_by map.
# Source: WRI Global Power Plant Database v1.3 (CC BY 4.0), no key. The database is no longer
# updated, so this polls weekly. The filter keeps plants of 600 MW or more. max_records caps
# rows BEFORE the filter runs, so it must cover the whole file (~35,000 rows).
schema_version: 1
name: wri_power_plants
source_type: wri_gppd
layer_type: power_plants
display_name: 'Power Plants (600 MW+)'
enabled: true

layer:
  id: power_plants
  name: Power plants (600 MW+)
  group: Infrastructure
  description: WRI Global Power Plant Database, coloured by primary fuel

display:
  icon: power
  color: '#ffc400'
  color_by:
    field: metadata.primary_fuel
    map:
      Coal: '#6d4c41'
      Gas: '#ff9100'
      Oil: '#d84315'
      Nuclear: '#ffea00'
      Hydro: '#2979ff'
      Wind: '#00e5ff'
      Solar: '#ffd740'
    default: '#bdbdbd'
  size: 0.9
  fields:
    - { path: metadata.primary_fuel, label: Fuel }
    - { path: metadata.capacity_mw, label: Capacity, format: number, precision: 0, suffix: ' MW' }
    - { path: metadata.owner, label: Owner }
    - { path: metadata.country, label: Country }
    - { path: metadata.url, label: Source, format: link }

transport:
  type: http_poll
  url: 'https://raw.githubusercontent.com/wri/global-power-plant-database/master/output_database/global_power_plant_database.csv'
  headers:
    Accept: 'text/csv'
  timeout: '60s'
  interval: '7d'
  retry:
    max_attempts: 3
    backoff: exponential
    initial_delay: '10s'
    max_delay: '2m'

parser:
  format: csv
  max_records: 40000

filter:
  - expr: 'number(capacity_mw) >= 600'

entity:
  external_id: 'gppd_idnr'
  name: 'name'
  metadata:
    primary_fuel: 'primary_fuel'
    capacity_mw: '=number(capacity_mw)'
    owner: 'owner'
    country: 'country_long'
    url: 'url'

observation:
  latitude: 'latitude'
  longitude: 'longitude'

recording:
  mode: upsert
