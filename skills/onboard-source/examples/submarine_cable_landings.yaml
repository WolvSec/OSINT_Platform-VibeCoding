# GeoJSON example: a FeatureCollection of Point features (coordinates are [lon, lat]).
# Shows: parser.format geojson, color_by map on a boolean, a link built with concat().
# Source: TeleGeography Submarine Cable Map (https://www.submarinecablemap.com/), no key.
# Static reference data, so it polls once a day and has no ttl.
schema_version: 1
name: submarine_cable_landings
source_type: submarinecablemap
layer_type: cable_landings
display_name: 'Submarine Cable Landings'
enabled: true

layer:
  id: cable_landings
  name: Cable landing points
  group: Infrastructure
  description: TeleGeography submarine cable landing stations

display:
  icon: cable
  color: '#18ffff'
  color_by:
    field: metadata.is_tbd
    map: { 'true': '#ffab40', 'false': '#18ffff' }
  size: 0.7
  fields:
    - { path: metadata.is_tbd, label: Location TBD, format: bool }
    - { path: metadata.map_url, label: Cable map, format: link }

transport:
  type: http_poll
  url: 'https://www.submarinecablemap.com/api/v3/landing-point/landing-point-geo.json'
  headers:
    Accept: 'application/json'
  timeout: '30s'
  interval: '24h'
  retry:
    max_attempts: 3
    backoff: exponential
    initial_delay: '10s'
    max_delay: '2m'

parser:
  format: geojson # records_path defaults to "features"
  max_records: 3000

entity:
  external_id: 'properties.id'
  name: 'properties.name'
  metadata:
    is_tbd: 'properties.is_tbd'
    map_url: "=concat('https://www.submarinecablemap.com/landing-point/', properties.id)"

observation:
  latitude: 'geometry.coordinates[1]'
  longitude: 'geometry.coordinates[0]'

recording:
  mode: upsert
